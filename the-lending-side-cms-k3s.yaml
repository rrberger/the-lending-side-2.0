# ==============================================================================
# THE LENDING SIDE — AUTHORING STUDIO CMS K3S DEPLOYMENT MANIFEST
# Always-on blog authoring backend for Minilab K3s
# Backend: Python 3.11 (stdlib http.server + boto3 R2)
# Storage: PVC for data/posts.json + git repo
# NodePort: 30086 -> Host Port 8086
# ==============================================================================

# 1. Persistent Storage for Blog Data & Git Repo
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tls-cms-data-pvc
  namespace: default
  labels:
    app: tls-cms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# 2. Studio CMS Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-cms
  namespace: default
  labels:
    app: tls-cms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-cms
  template:
    metadata:
      labels:
        app: tls-cms
    spec:
      containers:
      - name: tls-cms
        image: tls-cms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CMS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: tls-cms-secrets
              key: CMS_AUTH_TOKEN
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: tls-cms-secrets
              key: GITHUB_PAT
        - name: R2_BUCKET_NAME
          value: "the-lending-side-media"
        - name: R2_PUBLIC_CUSTOM_DOMAIN
          value: "https://media.thelendingside.com"
        - name: REPO_DIR
          value: "/data/repo"
        - name: GIT_REPO_URL
          value: "https://github.com/rrberger/the-lending-side-2.0.git"
        - name: GIT_BRANCH
          value: "master"
        volumeMounts:
        - name: cms-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: cms-data
        persistentVolumeClaim:
          claimName: tls-cms-data-pvc
---
# 3. Studio CMS NodePort Service (NodePort 30086 -> Host Port 8086)
apiVersion: v1
kind: Service
metadata:
  name: tls-cms-service
  namespace: default
  labels:
    app: tls-cms
spec:
  type: NodePort
  selector:
    app: tls-cms
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30086
